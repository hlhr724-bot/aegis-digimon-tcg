name: Simulator verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check
      - name: Install rules PDF extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fast pull request checks
        if: github.event_name == 'pull_request'
        run: pnpm verify:simulator
      - name: API tests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @aegis/api test
      - name: Scheduled and manual deep checks
        if: github.event_name != 'pull_request'
        run: pnpm verify:simulator:deep
