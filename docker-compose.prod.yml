# Legacy/bootstrap stack and source of the application's production environment.
# After gateway migration, NEVER deploy this file with `up --build`: it would
# introduce competing proxies and APIs. Use tools/deploy/deploy.mjs instead;
# see docs/deployment-room-continuity.md for the installed Dokploy command.
#
# Production stack for a self-hosted deployment that sits behind an external
# reverse proxy. The proxy terminates TLS and forwards to the `aegis-web`
# alias on the shared network named by AEGIS_EDGE_NETWORK, so no host ports
# are published here.
#
# The API runs as three processes, not one. A Colyseus process is single-threaded, so one
# process uses one core no matter how many the host has; the three share their matchmaking
# state through Redis and each advertises its own public path (`/p1`, `/p2`, `/p3`) so the
# client SDK connects straight to the process that owns its room. `docker/Caddyfile` routes
# those paths, and every other request is load-balanced across the three.
#
# Every deployment-specific value comes from the environment. Required:
# AEGIS_PUBLIC_URL, AEGIS_PUBLIC_WS_URL, AEGIS_EDGE_NETWORK, POSTGRES_PASSWORD,
# RESEND_API_KEY, AEGIS_EMAIL_FROM, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET.
# Optional: DISCORD_BOT_TOKEN (refreshes Discord avatars without a new sign-in and
# posts tournaments; see docs/TOURNAMENT_DISCORD.md for the AEGIS_TOURNAMENT_DISCORD_* values),
# POSTGRES_DB, POSTGRES_USER, AEGIS_REVISION, AEGIS_DEPLOYMENT_MODE,
# AEGIS_ALERT_EMAIL (server errors are emailed there through Resend),
# BREVO_API_KEY, BREVO_EMAIL_FROM (sign-in emails fall back to Brevo once Resend
# reaches its daily limit), RESEND_DAILY_LIMIT and BREVO_DAILY_LIMIT (sends per UTC
# day; default 100 and 300, the free plans),
# OCI_SMTP_HOST, OCI_SMTP_USER, OCI_SMTP_PASSWORD, OCI_EMAIL_FROM, OCI_DAILY_LIMIT
# (OCI Email Delivery after Brevo; default 50,000 a day, the tenancy limit),
# TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY (Cloudflare Turnstile check on sign-in
# email requests; set both together, unset disables the check),
# GITHUB_TOKEN, GITHUB_BUG_REPOSITORY, GITHUB_BUG_LABELS (optional public GitHub copy),
# FEEDBACK_GITHUB_ENABLED and DECK_REPORTS_GITHUB_ENABLED (default false; "true" also
# files player feedback and deck reports as GitHub issues; Postgres is always the record),
# AEGIS_TRUSTED_PROXY_HOPS (proxies in
# front of the API, which is how an anonymous reporter's address is read),
# OPENAI_API_KEY (first avatar screening layer; the image's bundled model is the fallback),
# AVATAR_NSFW_THRESHOLD and AVATAR_MODERATION_TIMEOUT_MS (default 0.7 and 8000).
#
# For local development use docker-compose.yml instead.

# One definition, three processes. Only AEGIS_PROCESS_PATH differs, and it has to: two
# processes advertising the same public address would hand clients seat reservations that
# live on the other one.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  # Three processes on a four-core host: enough for each to saturate a core under load
  # while leaving the host a core for Postgres, Redis and the proxy.
  cpus: 1.25
  mem_limit: 1500m
  environment: &api-env
    NODE_ENV: production
    PORT: "2567"
    DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aegis}
    AEGIS_WEB_URL: ${AEGIS_PUBLIC_URL:?AEGIS_PUBLIC_URL must be set}
    AEGIS_API_URL: ${AEGIS_PUBLIC_URL}
    AEGIS_REVISION: ${AEGIS_REVISION:-production}
    AEGIS_PUBLIC_VERSION: ${AEGIS_PUBLIC_VERSION:-1.0.0-beta}
    AEGIS_REDIS_URL: redis://redis:6379
    RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
    AEGIS_EMAIL_FROM: ${AEGIS_EMAIL_FROM:?AEGIS_EMAIL_FROM must be set}
    AEGIS_ALERT_EMAIL: ${AEGIS_ALERT_EMAIL:-}
    RESEND_DAILY_LIMIT: ${RESEND_DAILY_LIMIT:-100}
    BREVO_API_KEY: ${BREVO_API_KEY:-}
    BREVO_EMAIL_FROM: ${BREVO_EMAIL_FROM:-}
    BREVO_DAILY_LIMIT: ${BREVO_DAILY_LIMIT:-300}
    OCI_SMTP_HOST: ${OCI_SMTP_HOST:-}
    OCI_SMTP_USER: ${OCI_SMTP_USER:-}
    OCI_SMTP_PASSWORD: ${OCI_SMTP_PASSWORD:-}
    OCI_EMAIL_FROM: ${OCI_EMAIL_FROM:-}
    OCI_DAILY_LIMIT: ${OCI_DAILY_LIMIT:-50000}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
    DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
    DISCORD_REDIRECT_URI: ${AEGIS_PUBLIC_URL}/auth/discord/callback
    DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    AEGIS_TOURNAMENT_DISCORD_BOT_TOKEN: ${AEGIS_TOURNAMENT_DISCORD_BOT_TOKEN:-}
    AEGIS_TOURNAMENT_DISCORD_CHANNEL_ID: ${AEGIS_TOURNAMENT_DISCORD_CHANNEL_ID:-}
    AEGIS_TOURNAMENT_DISCORD_GUILD_ID: ${AEGIS_TOURNAMENT_DISCORD_GUILD_ID:-}
    AEGIS_TOURNAMENT_DISCORD_ROLES: ${AEGIS_TOURNAMENT_DISCORD_ROLES:-}
    ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITHUB_BUG_REPOSITORY: ${GITHUB_BUG_REPOSITORY:-}
    FEEDBACK_GITHUB_ENABLED: ${FEEDBACK_GITHUB_ENABLED:-false}
    DECK_REPORTS_GITHUB_ENABLED: ${DECK_REPORTS_GITHUB_ENABLED:-false}
    GITHUB_BUG_LABELS: ${GITHUB_BUG_LABELS:-}
    AEGIS_TRUSTED_PROXY_HOPS: ${AEGIS_TRUSTED_PROXY_HOPS:-2}
    AEGIS_WAITING_ROOM_TIMEOUT_SECONDS: ${AEGIS_WAITING_ROOM_TIMEOUT_SECONDS:-1800}
    AEGIS_PROVIDER_SYNC_ENABLED: ${AEGIS_PROVIDER_SYNC_ENABLED:-true}
    AEGIS_DIGILAB_API_KEY: ${AEGIS_DIGILAB_API_KEY:-}
    AEGIS_GOOGLE_API_KEY: ${AEGIS_GOOGLE_API_KEY:-}
    AEGIS_CLIENT_ERROR_WEBHOOK_URL: ${AEGIS_CLIENT_ERROR_WEBHOOK_URL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    AVATAR_NSFW_THRESHOLD: ${AVATAR_NSFW_THRESHOLD:-0.7}
    AVATAR_MODERATION_TIMEOUT_MS: ${AVATAR_MODERATION_TIMEOUT_MS:-8000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  # Docker keeps container stdout forever by default; the app rotates its own file log and
  # this bounds the other half.
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  api:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p1

  api2:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p2

  api3:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p3

  # Matchmaking state: room listings, seat reservations and private room codes.
  #
  # Appended to disk, though none of it outlives a deploy. A Redis that comes back empty while
  # the API processes keep running leaves every match in progress invisible to matchmaking —
  # its room code stops resolving and joinById fails — until each room happens to write again.
  # The append log costs nothing and closes that window on a restart. It lives in the container
  # layer with no volume on purpose: recreating this container is part of a deploy, which
  # recreates the API processes too, and their rooms are gone at that point anyway.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AEGIS_API_URL: ${AEGIS_PUBLIC_WS_URL:?AEGIS_PUBLIC_WS_URL must be set}
        VITE_AEGIS_REVISION: ${AEGIS_REVISION:-production}
        VITE_AEGIS_PUBLIC_VERSION: ${AEGIS_PUBLIC_VERSION:-1.0.0-beta}
        VITE_AEGIS_DEPLOYMENT_MODE: ${AEGIS_DEPLOYMENT_MODE:-direct}
        VITE_GOOGLE_CLIENT_ID: ${AEGIS_GOOGLE_CLIENT_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    expose:
      - "80"
    networks:
      default:
        aliases:
          - aegis-web

networks:
  default:
    external: true
    name: ${AEGIS_EDGE_NETWORK:?AEGIS_EDGE_NETWORK must be set}

volumes:
  postgres_data:
